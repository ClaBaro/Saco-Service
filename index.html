<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SACO Service</title>

<style>
body {margin:0;font-family:Arial;background:#f5f5f5;}
.top {background:#34495a;color:white;padding:15px;text-align:center;font-size:20px;}
.container {padding:15px;}
input, select, textarea {width:100%;padding:10px;margin:5px 0;border:0;border-bottom:2px solid #ccc;}
button {padding:10px;background:#ff9800;color:white;border:0;width:100%;}
.card {background:white;padding:10px;margin-top:10px;border-radius:8px;}
.tabs {display:flex;background:#ddd;}
.tabs div {flex:1;padding:10px;text-align:center;cursor:pointer;}
.active {background:white;font-weight:bold;}
.hidden {display:none;}
</style>
</head>

<body>

<div class="top">SACO Service</div>

<div class="container">

<div id="login">
<h3>Login</h3>
<input id="email">
<button onclick="login()">Entra</button>
</div>

<div id="app" class="hidden">

<div class="tabs">
<div onclick="tab('doc')" class="active">DOCUMENTO</div>
<div onclick="tab('imp')">IMPIANTO</div>
<div onclick="tab('tar')">TARIFFE</div>
</div>

<div id="doc">
<input id="cliente" placeholder="Cliente">
<input id="data" type="date">
<input id="ora" type="time">
<textarea id="difetto" placeholder="Problema"></textarea>
<input type="file" id="file" multiple>
</div>

<div id="imp" class="hidden">
<input placeholder="Indirizzo">
<input placeholder="Impianto">
</div>

<div id="tar" class="hidden">
<input placeholder="Tariffa oraria">
<input placeholder="KM">
</div>

<button onclick="salva()">Salva</button>

<h3>Interventi</h3>
<div id="lista"></div>

</div>

</div>

<script>

let autorizzati = ["info@sacoservice.it"];

function login(){
let email = document.getElementById("email").value;
if(autorizzati.includes(email)){
document.getElementById("login").style.display="none";
document.getElementById("app").classList.remove("hidden");
carica();
}else{
alert("Email non autorizzata");
}
}

function tab(nome){
document.getElementById("doc").classList.add("hidden");
document.getElementById("imp").classList.add("hidden");
document.getElementById("tar").classList.add("hidden");

document.getElementById(nome).classList.remove("hidden");
}

function salva(){

let cliente = document.getElementById("cliente").value;
let data = document.getElementById("data").value;
let difetto = document.getElementById("difetto").value;

let lista = JSON.parse(localStorage.getItem("dati") || "[]");

lista.push({cliente,data,difetto});

localStorage.setItem("dati", JSON.stringify(lista));

carica();
}

function carica(){

let listaDiv = document.getElementById("lista");
listaDiv.innerHTML = "";

let dati = JSON.parse(localStorage.getItem("dati") || "[]");

dati.forEach(d=>{
listaDiv.innerHTML += `
<div class="card">
<b>${d.cliente}</b><br>
${d.data}<br>
${d.difetto}
</div>`;
});
}

</script>

</body>
</html>
